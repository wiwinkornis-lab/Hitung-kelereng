<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penghitung Kelereng</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f1f1f1;--ac:#0a7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#eee;--mut:#aaa;--card:#232323;--ac:#3ddc97}}
:root[data-theme="dark"]{--bg:#121212;--fg:#eee;--mut:#aaa;--card:#232323;--ac:#3ddc97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
h1{font-size:18px;margin:0 0 8px}
.cnt{font-size:72px;font-weight:700;text-align:center;color:var(--ac);line-height:1}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden;margin:8px 0}
video,canvas{display:block;width:100%}
canvas{position:absolute;inset:0;height:100%;touch-action:none}
.row{display:flex;gap:8px;margin:8px 0}
button{flex:1;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px}
button.g{background:var(--card);color:var(--fg)}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
input[type=range]{width:100%}
p{font-size:13px;color:var(--mut)}
</style></head><body>
<h1>Penghitung Kelereng</h1>
<div class="cnt" id="n">0</div>
<div class="cam"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div class="row"><button id="start">Mulai kamera</button><button class="g" id="sw" style="display:none">Ganti kamera</button><button class="g" id="reset">Reset</button></div>
<p id="st" style="font-weight:600;color:var(--fg)"></p>
<label>Sensitivitas gerakan: <span id="tv">25</span></label>
<input type="range" id="th" min="8" max="80" value="25">
<label>Tebal garis hitung: <span id="bv">4</span></label>
<input type="range" id="bd" min="1" max="12" value="4">
<label>Jeda antar benda (ms): <span id="jv">300</span></label>
<input type="range" id="jd" min="50" max="1000" step="50" value="300">
<p>Ketuk atau geser di layar kamera untuk memindahkan garis. Setiap kelereng yang lewat garis dihitung 1. Pakai latar polos dan cahaya terang.</p>
<script>
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d');
const N=document.getElementById('n'),W=240,H=180;
const off=document.createElement('canvas');off.width=W;off.height=H;
const o=off.getContext('2d',{willReadFrequently:true});
let lineY=0.5,count=0,prev=null,prevRuns=[],active=false,lastMotion=-9999,facing='environment',looping=false;
const th=document.getElementById('th'),bd=document.getElementById('bd'),jd=document.getElementById('jd');
th.oninput=()=>tv.textContent=th.value;bd.oninput=()=>bv.textContent=bd.value;jd.oninput=()=>jv.textContent=jd.value;
document.getElementById('reset').onclick=()=>{count=0;N.textContent=0};
document.getElementById('sw').onclick=()=>{facing=facing==='user'?'environment':'user';document.getElementById('start').onclick()};
function setLine(e){const r=c.getBoundingClientRect();lineY=Math.min(.95,Math.max(.05,(e.clientY-r.top)/r.height))}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);setLine(e)});
c.addEventListener('pointermove',e=>{if(e.buttons)setLine(e)});
document.getElementById('start').onclick=async()=>{
  const st=document.getElementById('st');st.textContent='Tombol ditekan, meminta izin kamera...';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Halaman ini tidak boleh memakai kamera (diblokir oleh bingkai tempat halaman ditampilkan).';return}
  try{
    if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;await new Promise(r=>setTimeout(r,400))}
    let s;
    try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:60}},audio:false})}
    catch(e1){await new Promise(r=>setTimeout(r,600));s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})}
    if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
    v.srcObject=s;await v.play();c.width=v.videoWidth;c.height=v.videoHeight;prev=null;
    document.getElementById('start').style.display='none';document.getElementById('sw').style.display='block';st.textContent='Kamera '+(facing==='user'?'depan':'belakang')+' aktif';
    if(!looping){looping=true;requestAnimationFrame(loop)}
  }catch(e){document.getElementById('st').textContent='Kamera gagal dibuka: '+(e&&e.name?e.name:'error')+'. '+(e&&e.message?e.message:'')}
};
function loop(){
  o.drawImage(v,0,0,W,H);
  const d=o.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=d[i*4+1];
  const yc=Math.round(lineY*H),b=+bd.value,t=+th.value;
  const y0=Math.max(0,yc-b),y1=Math.min(H-1,yc+b);
  let runs=[];
  if(prev){
    const f=new Uint8Array(W);
    for(let X=0;X<W;X++)for(let y=y0;y<=y1;y++){if(Math.abs(g[y*W+X]-prev[y*W+X])>t){f[X]=1;break}}
    let s=-1,gap=0;
    for(let X=0;X<=W;X++){
      if(X<W&&f[X]){if(s<0)s=X;gap=0;}
      else if(s>=0){gap++;if(gap>2||X===W){runs.push([s,X-gap]);s=-1;gap=0}}
    }
    const now=performance.now();
    if(runs.length){
      if(now-lastMotion>+jd.value){count++;N.textContent=count;if(navigator.vibrate)navigator.vibrate(20)}
      lastMotion=now;
    }
  }
  prev=g;prevRuns=runs;active=runs.length>0;
  const cy=lineY*c.height,bh=(b/H)*c.height;
  x.clearRect(0,0,c.width,c.height);
  x.fillStyle=active?'rgba(255,60,60,.35)':'rgba(60,220,150,.25)';
  x.fillRect(0,cy-bh,c.width,bh*2);
  x.strokeStyle=active?'#ff3c3c':'#3ddc97';x.lineWidth=3;
  x.beginPath();x.moveTo(0,cy);x.lineTo(c.width,cy);x.stroke();
  requestAnimationFrame(loop);
}
</script></body></html>
